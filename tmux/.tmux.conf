# --------------------------
# Terminal / Truecolor Setup
# --------------------------
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g status-position bottom
set-option -g history-limit 64096
set -sg escape-time 10

# --------------------------
# Prefix Key
# --------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --------------------------
# Pane Splitting
# --------------------------
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# --------------------------
# Reload Config
# --------------------------
unbind r
bind r source-file ~/.tmux.conf

# --------------------------
# Mouse Mode
# --------------------------
set -g mouse on
# --------------------------
# Copy Mode (vi style) & System Clipboard
# --------------------------
set-window-option -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane
# macOS clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Linux clipboard (uncomment if using Linux)
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# --------------------------
# TPM Plugins
# --------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# --------------------------
# SessionX Settings
# --------------------------
# Bind SessionX to prefix+s
bind s run-shell "tmux-sessionx"
# Optional: force popup = 1 (default). For fallback: set to 0
set -g @sessionx-popup 1
# Manually source SessionX plugin for reliability
run-shell ~/.tmux/plugins/tmux-sessionx/sessionx.tmux

# --------------------------
# Look & Feel
# --------------------------
set-option -g status-fg cyan
set-option -g status-bg black
set -g pane-active-border-style fg=colour166,bg=default
set -g window-style fg=colour10,bg=default
set -g window-active-style fg=colour12,bg=default

# --------------------------
# macOS specific config
# --------------------------
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# --------------------------
# Import custom configs
# --------------------------
source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# --------------------------
# TPM Initialization (keep last!)
# --------------------------
run '~/.tmux/plugins/tpm/tpm'

