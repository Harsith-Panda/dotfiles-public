# Status bar basics
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-style "fg=#ffffff,bg=#1a1a1a"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style none
set -g status-right-style none

# Powerline-style left segment: Session + User
set -g status-left "#[fg=#1a1a1a,bg=#72d6b6,bold]  #[fg=#72d6b6,bg=#4285F4]#[fg=#ffffff,bg=#4285F4,bold] #S #[fg=#4285F4,bg=#2b50aa]#[fg=#ffffff,bg=#2b50aa,bold] #(whoami) #[fg=#2b50aa,bg=#1a1a1a]"

# Powerline-style right segment: Time + Date + Host
set -g status-right "#[fg=#1a1a1a,bg=#2b50aa]#[fg=#ffffff,bg=#2b50aa,bold] #[fg=#ffffff,bg=#4285F4,bold] %H:%M #[fg=#72d6b6,bg=#4285F4]#[fg=#1a1a1a,bg=#72d6b6,bold] #(hostname) "

# Window styling
setw -g window-status-separator ""
setw -g window-status-style "fg=#ffffff,bg=#1a1a1a"
setw -g window-status-activity-style "underscore,fg=#ffffff,bg=#1a1a1a"

# Inactive windows
setw -g window-status-format '#[fg=#1a1a1a,bg=#1a1a1a]#[fg=#ffffff,bg=#1a1a1a] #I:#W #[fg=#1a1a1a,bg=#1a1a1a]'

# Active window
setw -g window-status-current-format '#[fg=#1a1a1a,bg=#72d6b6]#[fg=#ffffff,bg=#72d6b6,bold] #I #[fg=#72d6b6,bg=#4285F4]#[fg=#ffffff,bg=#4285F4] #W #[fg=#4285F4,bg=#1a1a1a]'
